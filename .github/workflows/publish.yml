name: Publish to npm

# Runs when a version tag such as v0.1.0 is pushed. Not active until npm trusted publishing (OIDC) is configured for
# repository tmailor-com/tmailor-node, workflow publish.yml, environment npm (with required reviewers) on npmjs.com:
# no npm token is stored. The package is published with provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1
          fi
          grep -q "VERSION = \"$version\"" src/version.ts || { echo "src/version.ts does not match $version"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v5
        with:
          name: package
          path: tmailor-*.tgz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/tmailor
    permissions:
      contents: read
      id-token: write  # required for trusted publishing and provenance
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest  # trusted publishing needs npm 11.5.1 or later
      - uses: actions/download-artifact@v5
        with:
          name: package
      # First release only: the package does not exist yet, so trusted publishing cannot be configured; a one-use
      # granular token (environment secret NPM_TOKEN) publishes 0.1.0. Afterwards: configure the trusted publisher on
      # npmjs.com, delete the token and this secret (npm then authenticates with OIDC through id-token: write).
      # On failure the npm error lines go to an annotation (readable without signing in); npm never prints the token.
      - name: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          echo "::notice::npm $(npm --version), auth: $(npm whoami 2>/dev/null || echo 'none (OIDC or missing token)')"
          npm publish ./tmailor-*.tgz --provenance --access public > publish.log 2>&1; rc=$?
          cat publish.log
          if [ $rc -ne 0 ]; then
            echo "::error::$(grep -E '^npm (error|ERR!)' publish.log | head -n 12 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit $rc
